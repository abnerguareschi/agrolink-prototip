<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>AgroLink Castelo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1E5A2C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=Caveat:wght@600&display=swap">
<style>
/* Layout: app de uma tela — barra inferior fixa no celular, menu lateral fixo no computador (>= 960px) */
:root{
  --bg:#EEF3E9; --surface:#FFFFFF; --surface-2:#E3EBDC; --fg:#14261A; --muted:#55685A; --line:#D2DDCA;
  --brand:#1E5A2C; --brand-2:#3F9A3B; --on-brand:#FFFFFF; --brand-soft:#DCEBD5;
  --sun:#E2A91F; --sun-soft:#F8EBC4;
  --ok:#2D7A34; --ok-soft:#DDEFD9; --warn:#9A5F0C; --warn-soft:#F6E6C9;
  --danger:#B23A2A; --danger-soft:#F6DDD7; --info:#22668A; --info-soft:#D8E9F2;
  --hero:#173F22; --hero-fg:#F2F7EE; --hero-muted:#B9CDB8;
  --paper:#FFFFFF; --ink:#1A3570; --overlay:rgba(10,20,12,.5);
  --shadow:0 1px 2px rgba(20,38,26,.06),0 6px 18px rgba(20,38,26,.07);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-sign:"Caveat","Brush Script MT","Segoe Script",cursive;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1611; --surface:#16211A; --surface-2:#1D2B22; --fg:#E4EEE2; --muted:#9BAF9E; --line:#2A3B2F;
  --brand:#62C25E; --brand-2:#86D482; --on-brand:#0B1A0E; --brand-soft:#1F3524;
  --sun:#F0C04A; --sun-soft:#3A3117; --ok:#6CC46F; --ok-soft:#1C3420; --warn:#E6A84A; --warn-soft:#3A2C14;
  --danger:#EE7A68; --danger-soft:#3D1F1A; --info:#6DB6DC; --info-soft:#16303D;
  --hero:#10281A; --hero-fg:#EAF3E6; --hero-muted:#9FB8A0; --overlay:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1611; --surface:#16211A; --surface-2:#1D2B22; --fg:#E4EEE2; --muted:#9BAF9E; --line:#2A3B2F;
  --brand:#62C25E; --brand-2:#86D482; --on-brand:#0B1A0E; --brand-soft:#1F3524;
  --sun:#F0C04A; --sun-soft:#3A3117; --ok:#6CC46F; --ok-soft:#1C3420; --warn:#E6A84A; --warn-soft:#3A2C14;
  --danger:#EE7A68; --danger-soft:#3D1F1A; --info:#6DB6DC; --info-soft:#16303D;
  --hero:#10281A; --hero-fg:#EAF3E6; --hero-muted:#9FB8A0; --overlay:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:800} h2{font-size:1.3rem;font-weight:800} h3{font-size:1.05rem;font-weight:600}
p{margin:0} a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.75rem}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px} .stack-lg{display:flex;flex-direction:column;gap:22px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap} .row.between{justify-content:space-between} .row.nowrap{flex-wrap:nowrap}
.grow{flex:1;min-width:0}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:16px;height:16px} .ico.lg{width:28px;height:28px}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid transparent;background:var(--surface-2);color:var(--fg);font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--brand);color:var(--on-brand)}
.btn.sun{background:var(--sun);color:#2A1E00}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.link{background:none;border:0;padding:0;min-height:auto;color:var(--brand);text-decoration:underline;text-underline-offset:3px}
.btn.sm{min-height:36px;padding:0 12px;font-size:.88rem}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.iconbtn{position:relative;display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;border:0;background:transparent;color:var(--fg);cursor:pointer}
.iconbtn:hover{background:var(--surface-2)}
.badge{position:absolute;top:4px;right:3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:.68rem;font-weight:800;display:grid;place-items:center;border:2px solid var(--surface)}

/* Campos */
.field{display:flex;flex-direction:column;gap:5px}
.field>span{font-weight:700;font-size:.88rem}
.input{width:100%;min-height:46px;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--surface);outline:none}
.input:focus{border-color:var(--brand)}
textarea.input{min-height:84px;resize:vertical}
.pw{position:relative} .pw .input{padding-right:48px} .pw .iconbtn{position:absolute;right:3px;top:2px}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-weight:600}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--brand);flex:none}
.err{background:var(--danger-soft);color:var(--danger);padding:10px 12px;border-radius:var(--r-sm);font-weight:600;font-size:.9rem}
.note{background:var(--info-soft);color:var(--fg);padding:10px 12px;border-radius:var(--r-sm);font-size:.88rem;display:flex;gap:10px}
.note .ico{color:var(--info);margin-top:1px}
.note.warn{background:var(--warn-soft)} .note.warn .ico{color:var(--warn)}
.note.ok{background:var(--ok-soft)} .note.ok .ico{color:var(--ok)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;min-height:40px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}

/* Cartões e listas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.flat{border:0;background:var(--surface-2)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;gap:12px;align-items:center;padding:13px 14px;border-top:1px solid var(--line);text-align:left;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;cursor:pointer;color:inherit}
.li:first-child{border-top:0}
.li:hover{background:var(--surface-2)}
.li.static{cursor:default} .li.static:hover{background:none}
.li .chev{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:.76rem;font-weight:800;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.danger{background:var(--danger-soft);color:var(--danger)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.brand{background:var(--brand-soft);color:var(--brand)} .pill.sun{background:var(--sun-soft);color:var(--warn)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.88rem;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--brand-soft);color:var(--brand);flex:none;font-family:var(--f-display)}
.avatar.lg{width:64px;height:64px;font-size:1.4rem}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}

/* Produtos */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;color:inherit}
.pcard:hover{border-color:var(--brand-2)}
.thumb{aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;font-size:3rem;background:var(--brand-soft);position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .tag{position:absolute;left:8px;top:8px}
.pcard .pb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.pcard .pn{font-weight:800;line-height:1.25}
.price{font-family:var(--f-display);font-weight:800;font-size:1.1rem;color:var(--brand)}
.stars{color:var(--sun);letter-spacing:1px;white-space:nowrap}

/* Shell */
.layout{min-height:100%}
.side{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;min-height:60px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.top .title{flex:1;min-width:0;font-family:var(--f-display);font-weight:800;font-size:1.08rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandmark{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;line-height:1;color:var(--fg);text-decoration:none}
.brandmark small{display:block;font-family:var(--f-body);font-weight:700;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.content{max-width:1080px;margin:0 auto;padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 8px;font-size:.72rem;font-weight:700;color:var(--muted);cursor:pointer}
.bottom button.on{color:var(--brand)}
.bottom button.on .ico{stroke-width:2.4}
.nav a,.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:10px;border:0;background:none;font-weight:700;color:var(--fg);cursor:pointer;text-align:left;text-decoration:none}
.nav button:hover{background:var(--surface-2)}
.nav button.on{background:var(--brand-soft);color:var(--brand)}
.nav .sep{height:1px;background:var(--line);margin:8px 4px}
.drawer-bg{position:fixed;inset:0;background:var(--overlay);z-index:50}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(300px,86vw);background:var(--surface);z-index:51;padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;overflow:auto}
@media (min-width:960px){
  .layout{display:grid;grid-template-columns:260px 1fr}
  .side{display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:20px 14px}
  .bottom,.menu-btn,.top .brandmark{display:none}
  .top{padding-left:24px;padding-right:24px}
  .content{padding-left:32px;padding-right:32px;padding-bottom:48px}
}

/* Hero da home */
.hero{background:var(--hero);color:var(--hero-fg);border-radius:20px;padding:22px 20px 20px;position:relative;overflow:hidden}
.hero p{color:var(--hero-muted)}
.hero .mount{position:absolute;right:-20px;bottom:-8px;width:240px;opacity:.9;pointer-events:none}
.hero h1{max-width:20ch;position:relative}
.hero .search{position:relative;margin-top:16px;max-width:520px}
.hero .search .input{border:0;padding-left:44px;min-height:50px;border-radius:999px;color:var(--fg)}
.hero .search .ico{position:absolute;left:14px;top:15px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick button{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:800;cursor:pointer;text-align:left;color:var(--fg)}
.quick button .ico{color:var(--brand)}
@media (max-width:420px){.quick{grid-template-columns:1fr 1fr 1fr}.quick button{padding:12px 10px;font-size:.85rem}}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-family:var(--f-display);font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.kpi .bar i{display:block;height:100%;background:var(--brand-2)}

/* Linha do tempo */
.tl{display:flex;flex-direction:column}
.tl .st{display:grid;grid-template-columns:28px 1fr;gap:12px;position:relative;padding-bottom:18px}
.tl .st:last-child{padding-bottom:0}
.tl .st::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.tl .st:last-child::before{display:none}
.tl .st.done::before{background:var(--brand-2)}
.tl .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);border:2px solid var(--line)}
.tl .st.done .dot{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.tl .st.now .dot{background:var(--surface);border-color:var(--brand-2);color:var(--brand)}
.tl .st b{display:block}
.progress{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand-2)}

/* Chat */
.chatbox{display:flex;flex-direction:column;gap:8px;min-height:240px}
.bubble{max-width:80%;padding:9px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.bubble img{border-radius:8px;margin-top:4px;max-height:220px}
.bubble .who{font-size:.72rem;font-weight:800;opacity:.75}
.composer{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;background:var(--bg);padding-block:10px}
@media (min-width:960px){.composer{bottom:0}}

/* Termo / assinatura */
.termo{max-height:260px;overflow:auto;background:var(--surface-2);border-radius:var(--r-sm);padding:14px;font-size:.9rem;display:flex;flex-direction:column;gap:8px}
.termo.full{max-height:none}
.sigwrap{position:relative;background:var(--paper);border:1.5px dashed var(--line);border-radius:var(--r-sm);color:var(--ink)}
.sigwrap canvas{display:block;width:100%;height:160px;touch-action:none;cursor:crosshair}
.sigwrap .base{position:absolute;left:16px;right:16px;bottom:34px;border-bottom:1px solid #C9CFD8;pointer-events:none}
.sigwrap .hint{position:absolute;left:16px;bottom:10px;font-size:.75rem;color:#7A8290;pointer-events:none}
.sigtyped{font-family:var(--f-sign);font-size:2.2rem;color:var(--ink);background:var(--paper);border-radius:var(--r-sm);padding:6px 16px;min-height:72px;border:1.5px dashed var(--line);overflow-wrap:anywhere}
.sigimg{background:var(--paper);border-radius:8px;max-height:90px}

/* Mapa */
.map{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.map .pin{cursor:pointer}

/* Auth */
.auth{min-height:100%;display:flex;flex-direction:column;align-items:center;padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.auth .box{width:100%;max-width:460px;display:flex;flex-direction:column;gap:18px}
.auth .logo-big{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.auth .logo-big h1{font-size:2rem;color:var(--brand);letter-spacing:-.02em;line-height:1}
.auth .logo-big h1 span{color:var(--brand-2)}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.ob-art{width:128px;height:128px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);margin:8px auto}
.ob-art .ico{width:56px;height:56px;stroke-width:1.5}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--line)}
.dots i.on{width:22px;background:var(--brand)}
.choice{display:flex;gap:14px;align-items:center;padding:16px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;color:var(--fg)}
.choice:hover{border-color:var(--brand)}
.choice .avatar{width:52px;height:52px}

/* Sheet, toast */
.sheet-bg{position:fixed;inset:0;background:var(--overlay);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:20px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:700;max-width:min(92vw,460px);box-shadow:var(--shadow);text-align:center}
@media (min-width:960px){.toast{bottom:28px}}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:10px 12px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border-top:0;white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.stepper button{width:40px;height:40px;border:0;background:var(--surface-2);font-size:1.2rem;font-weight:800;cursor:pointer;color:var(--fg)}
.stepper input{width:64px;text-align:center;border:0;height:40px;background:var(--surface);font-weight:800}
.emoji-pick{display:flex;flex-wrap:wrap;gap:6px}
.emoji-pick button{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:1.4rem;cursor:pointer}
.emoji-pick button.on{border-color:var(--brand);background:var(--brand-soft)}
.diff{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

async function hashSenha(pw, salt){
  try{
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt+':'+pw));

  if (pr && !pr.consentVersao) r.push('Produtor ainda não assinou o termo LGPD');
  if (p.status==='pausado') r.push('Pausado por você');
  if (p.status==='suspenso') r.push('Suspenso pela equipe: '+(p.motivoStatus||'em análise'));
  if (p.qtd<=0) r.push('Sem quantidade disponível');
  if (!docOk(p.produtorId,'nf_produtor')) r.push('Falta aprovar a nota fiscal de produtor rural');
  if (p.origemAnimal && !docOk(p.produtorId,'inspecao')) r.push('Origem animal: falta o registro de inspeção sanitária');
  return r;
}

function proximasDatas(pr){
  const out = []; const d = new Date(); d.setHours(12,0,0,0);
  for (let i=1; i<=21 && out.length<4; i++){ const x = new Date(d.getTime()+i*864e5); if ((pr.diasEntrega||[]).includes(x.getDay())) out.push(isoDay(x)); }

}

function render(){
  const u = me();
  if (u && u.status!=='ativo'){ DB.sessao=null; save(); return render(); }
  if (!u){
    if (!DB.config.onboarded && !['login','cadastro','esqueci','termo'].includes(S.view)) return paint(vOnboarding());
    if (S.view==='termo' && S.pend) return paint(authWrap(vTermo('novo')));

  if (!V || (V.roles && !V.roles.includes(u.papel))){ S.view=home(u); S.params={}; }

}

function sigPronta(){ return S.sig.modo==='desenhar' ? S.sig.desenhou : (S.sig.nome||'').trim().length>=5; }
function atualizaBtnAssinar(){
  const b = document.getElementById('btn-assinar'); if (b) b.disabled = !(S.sig.ok && sigPronta());
  const st = document.getElementById('sig-st'); if (st) st.textContent = sigPronta() ? 'preenchida' : 'em branco';
}
function initAssinatura(){
  atualizaBtnAssinar();
  const c = document.getElementById('sig'); if (!c) return;
  const r = c.getBoundingClientRect(); const dpr = window.devicePixelRatio||1;
  c.width = Math.max(1,r.width*dpr); c.height = Math.max(1,r.height*dpr);
  const ctx = c.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0,0,r.width,r.height);
  ctx.lineWidth = 2.4; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle = '#1A3570';
  if (S.sig.data){ const img = new Image(); img.onload=()=>ctx.drawImage(img,0,0,r.width,r.height); img.src=S.sig.data; }
  let on=false, last=null;
  const pos = e => { const b = c.getBoundingClientRect(); return {x:e.clientX-b.left, y:e.clientY-b.top}; };
  c.addEventListener('pointerdown', e=>{ on=true; last=pos(e); try{c.setPointerCapture(e.pointerId);}catch(_){} ctx.beginPath(); ctx.arc(last.x,last.y,1.1,0,7); ctx.fillStyle='#1A3570'; ctx.fill(); });
  c.addEventListener('pointermove', e=>{ if(!on) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; if(!S.sig.desenhou){ S.sig.desenhou=true; atualizaBtnAssinar(); } });
  const fim = ()=>{ if(!on) return; on=false; if (S.sig.desenhou) S.sig.data = c.toDataURL('image/png'); atualizaBtnAssinar(); };
  c.addEventListener('pointerup', fim); c.addEventListener('pointercancel', fim); c.addEventListener('pointerleave', fim);
  const tick = setInterval(()=>{ const h = document.getElementById('termo-hora'); if (!h) return clearInterval(tick); h.textContent = fmtDT(now()); }, 15000);
}
async function assinarTermo(){
  if (!(S.sig.ok && sigPronta())) return;

  if (modo==='novo'){
    const p = S.pend; const salt = novoSalt();
    u = { id:nid('u'), nome:p.nome, email:p.email, telefone:p.telefone, papel:p.papel, tipoLogin:'e-mail', status:'ativo', criadoEm:now(), salt, senhaHash:await hashSenha(p.senha,salt),
      tipoComprador:p.tipoComprador, estabelecimento:p.estabelecimento, endereco:p.endereco||'', propriedade:p.propriedade, comunidade:p.comunidade||'Castelo (Sede)', frete:8, diasEntrega:[2,5], retirada:true, consentVersao:null };
    const c = COMUNIDADES[u.comunidade]||CASTELO; u.lat=c.lat; u.lng=c.lng;
    if (S.gps && u.papel==='comprador'){ u.lat=S.gps.lat; u.lng=S.gps.lng; }
    DB.usuarios.push(u);
  } else u = me();
  DB.consentimentos.filter(c=>c.usuarioId===u.id && !c.revogadoEm && !c.substituidoEm).forEach(c=>c.substituidoEm=now());
  DB.consentimentos.push({ id:nid('c'), usuarioId:u.id, nome:u.nome, email:u.email, versao:DB.config.termoVersao, dataHora:now(),
    ip:'registrado pelo servidor (versão final)', dispositivo:(navigator.userAgent||'').slice(0,90),
    assinaturaTipo:S.sig.modo==='desenhar'?'desenhada':'digitada', assinatura:S.sig.modo==='desenhar'?S.sig.data:S.sig.nome.trim(), revogadoEm:null });
  u.consentVersao = DB.config.termoVersao;
  DB.sessao = u.id; S.pend=null; S.sig={modo:null,desenhou:false,data:null}; S.stack=[];
  if (modo==='novo'){
    notificar(u.id,'Bem-vindo(a) à AgroLink Castelo!','Seu termo assinado está guardado no Perfil. Uma cópia em PDF é enviada para seu e-mail na versão final.',{v:'termo-ver'});
    notificarAdmins('Novo cadastro', u.nome+' criou uma conta de '+(u.papel==='produtor'?'produtor':'comprador')+'.', {v:'adm-usuarios'});
    if (u.papel==='produtor') notificar(u.id,'Envie seus documentos','Para publicar produtos, envie a nota fiscal de produtor rural.',{v:'p-documentos'});
  }
  save(); S.view = home(u); render();
  toast(modo==='novo' ? 'Conta criada e termo assinado.' : 'Termo assinado. Bem-vindo(a) de volta!');
}

VIEWS.pedido = { fn(u,{id}){

  const prox = proximoStatus(p);

  else if ((souProdutor||adm) && prox && p.status!=='recebido') acoes += `<button class="btn primary block" data-a="status" data-id="${p.id}" data-s="${prox}">Marcar como "${ST[prox].t}"</button>`;
  if (souComprador && p.status==='recebido') acoes += `<button class="btn danger block" data-a="cancelar" data-id="${p.id}">Cancelar pedido</button>`;
  if (souComprador && ['rota','pronto'].includes(p.status)) acoes += `<button class="btn primary block" data-a="status" data-id="${p.id}" data-s="entregue">Confirmar que recebi</button>`;

   <div class="stack-lg">

      ${p.motivoRecusa?`<div class="note warn">${I('info')}<span>${esc(p.motivoRecusa)}</span></div>`:''}
      ${idx>=0?`<div class="tl">${tl}</div>`:''}

    </div>
    <div class="card stack"><div class="eyebrow">Itens</div>
      <div class="list">${p.itens.map(i=>`<div class="li static"><span style="font-size:1.4rem" aria-hidden="true">${i.emoji||''}</span><div class="grow"><b>${esc(i.nome)}</b><div class="muted small num">${fmtQ(i.qtd)} ${esc(i.unidade)} × ${brl(i.preco)}</div></div><b class="num">${brl(i.qtd*i.preco)}</b></div>`).join('')}</div>
      <div class="stack num" style="gap:4px"><div class="row between"><span class="muted">Subtotal</span><span>${brl(p.subtotal)}</span></div><div class="row between"><span class="muted">Frete</span><span>${p.frete?brl(p.frete):'—'}</span></div><div class="row between"><b>Total</b><b>${brl(p.total)}</b></div>
      ${souProdutor||adm?`<div class="row between small"><span class="muted">Taxa AgroLink (5% do subtotal, só se concluída)</span><span>${brl(p.subtotal*COMISSAO)}</span></div>`:''}</div>
    </div>
   </div>
   <div class="stack-lg">
    <div class="card stack"><div class="eyebrow">Entrega</div>
      <div class="list">
        <div class="li static">${I(p.entrega==='entrega'?'truck':'store')}<div class="grow"><b>${p.entrega==='entrega'?'Entrega':'Retirada na propriedade'} · ${fmtDia(p.dataPrevista)}</b><div class="muted small">${esc(p.rota)}</div></div></div>
        ${p.entrega==='entrega'?`<div class="li static">${I('pin')}<div class="grow"><b>Endereço</b><div class="muted small">${confirmado||souComprador||adm?esc(p.endereco||'—'):'Liberado ao produtor após a confirmação'}</div></div></div>`:''}
        <div class="li static">${I('bag')}<div class="grow"><b>Pagamento</b><div class="muted small">${esc(p.pagamento)} · combinado com o produtor</div></div></div>

      <div class="row nowrap"><div class="avatar">${initials(souComprador?pr.propriedade:(cp.estabelecimento||cp.nome))}</div><div class="grow"><b>${esc(souComprador?pr.propriedade:(cp.estabelecimento||cp.nome))}</b><div class="muted small">${confirmado||adm?esc(souComprador?pr.telefone:cp.telefone):'Contato liberado após a confirmação'}</div></div></div>

   </div></div>`};

/* ---------- MAPA ---------- */
const BBOX = {lat0:-20.70, lat1:-20.49, lng0:-41.31, lng1:-41.05};
const proj = (lat,lng) => ({x: (lng-BBOX.lng0)/(BBOX.lng1-BBOX.lng0)*600, y: (BBOX.lat1-lat)/(BBOX.lat1-BBOX.lat0)*420});
function distKm(a,b){ const R=6371, r=Math.PI/180; const dLat=(b.lat-a.lat)*r, dLng=(b.lng-a.lng)*r; const h=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
VIEWS.mapa = { roles:['comprador'], fn(u){
  const ref = S.gps || (u.lat?{lat:u.lat,lng:u.lng}:CASTELO);

  const sede = proj(CASTELO.lat, CASTELO.lng);
  const roads = Object.entries(COMUNIDADES).filter(([k])=>k!=='Castelo (Sede)').map(([k,c])=>{const p=proj(c.lat,c.lng); const mx=(p.x+sede.x)/2+(p.y-sede.y)*.15, my=(p.y+sede.y)/2-(p.x-sede.x)*.15; return `<path d="M${sede.x} ${sede.y} Q${mx} ${my} ${p.x} ${p.y}" stroke="var(--line)" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M${sede.x} ${sede.y} Q${mx} ${my} ${p.x} ${p.y}" stroke="var(--surface)" stroke-width="1.5" fill="none" stroke-dasharray="6 6"/>`;}).join('');
  const labels = Object.entries(COMUNIDADES).map(([k,c])=>{const p=proj(c.lat,c.lng); return `<text x="${p.x}" y="${p.y+26}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted)" font-family="var(--f-body)">${k}</text>`;}).join('');
  const pins = prods.map(({x})=>{const p=proj(x.lat,x.lng); const sel=S.mapSel===x.id; return `<g class="pin" data-a="mapsel" data-id="${x.id}" role="button" tabindex="0" aria-label="${esc(x.propriedade)}"><circle cx="${p.x}" cy="${p.y}" r="${sel?15:12}" fill="${sel?'var(--sun)':'var(--brand)'}" stroke="var(--surface)" stroke-width="3"/><text x="${p.x}" y="${p.y+4}" text-anchor="middle" font-size="10" font-weight="800" fill="${sel?'#2A1E00':'var(--on-brand)'}" font-family="var(--f-body)">${initials(x.propriedade)}</text></g>`;}).join('');
  const me_ = proj(ref.lat, ref.lng);
  const sel = S.mapSel && user(S.mapSel);
  return { title:'Mapa dos produtores', html:`<div class="stack">
    <div class="map"><svg viewBox="0 0 600 420" role="img" aria-label="Mapa ilustrativo de Castelo com os produtores parceiros">
      <rect width="600" height="420" fill="var(--surface-2)"/>
      <path d="M40 60 C120 20 260 30 330 50 C430 70 540 40 575 120 C600 200 560 300 520 360 C450 410 300 400 200 390 C110 380 30 330 25 240 C20 160 10 90 40 60Z" fill="var(--brand-soft)"/>
      <path d="M520 20 C470 120 420 160 360 210 C300 260 260 300 180 330 C120 350 70 380 30 410" stroke="var(--info)" stroke-opacity=".45" stroke-width="5" fill="none"/>
      <text x="470" y="78" font-size="11" fill="var(--info)" font-family="var(--f-body)" font-weight="700">Rio Castelo</text>
      ${roads}
      <rect x="${sede.x-9}" y="${sede.y-9}" width="18" height="18" rx="4" fill="var(--fg)"/>
      ${labels}${pins}
      <circle cx="${me_.x}" cy="${me_.y}" r="7" fill="var(--info)" stroke="var(--surface)" stroke-width="3"/><text x="${me_.x+11}" y="${me_.y-8}" font-size="11" font-weight="800" fill="var(--info)" font-family="var(--f-body)">Você</text>
    </svg></div>
    <div class="row between"><span class="muted small">Mapa ilustrativo, posições aproximadas. Distâncias em linha reta${S.gps?' a partir do seu GPS':' a partir do seu endereço'}.</span><button class="btn sm ghost" data-a="gps">${I('gps','sm')} Usar meu GPS</button></div>
    ${sel?`<div class="card row nowrap"><div class="avatar">${initials(sel.propriedade)}</div><div class="grow"><b>${esc(sel.propriedade)}</b><div class="muted small">${esc(sel.comunidade)} · ${DB.produtos.filter(p=>p.produtorId===sel.id&&publicado(p)).map(p=>esc(p.nome)).join(', ')}</div></div><button class="btn sm primary" data-a="go" data-v="produtor" data-id="${sel.id}">Ver</button></div>`:''}
    <div class="list">${prods.map(({x,d})=>`<button class="li" data-a="go" data-v="produtor" data-id="${x.id}"><div class="avatar">${initials(x.propriedade)}</div><div class="grow"><b>${esc(x.propriedade)}</b><div class="muted small">${esc(x.comunidade)}</div></div><span class="num small"><b>${d.toFixed(1).replace('.',',')} km</b></span></button>`).join('')}</div>

VIEWS.admin = { roles:['admin'], fn(u){
  const prodAtivos = DB.usuarios.filter(x=>x.papel==='produtor'&&x.status==='ativo'&&docOk(x.id,'nf_produtor'));
  const estab = DB.usuarios.filter(x=>x.papel==='comprador'&&x.status==='ativo'&&x.tipoComprador!=='morador');
  const compradoresAtivos = new Set(DB.pedidos.filter(p=>p.criadoEm>daysAgo(60)).map(p=>p.compradorId)).size;
  const pub = DB.produtos.filter(publicado).length;
  const entregues = DB.pedidos.filter(p=>p.status==='entregue');
  const noPrazo = entregues.filter(p=>isoDay(p.etapas.entregue)<=p.dataPrevista).length;
  const tempo = entregues.length ? entregues.reduce((s,p)=>s+(p.etapas.entregue-p.etapas.recebido),0)/entregues.length/864e5 : 0;
  const sat = DB.avaliacoes.length ? DB.avaliacoes.reduce((s,a)=>s+a.nota,0)/DB.avaliacoes.length : 0;
  const comissao = entregues.reduce((s,p)=>s+p.subtotal*COMISSAO,0);
  const meses = []; const d0 = new Date(); for (let i=5;i>=0;i--){ const d = new Date(d0.getFullYear(), d0.getMonth()-i, 1); const fim = new Date(d.getFullYear(), d.getMonth()+1, 1); meses.push({rot:d.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''), n:DB.pedidos.filter(p=>p.criadoEm>=d.getTime()&&p.criadoEm<fim.getTime()).length}); }
  const max = Math.max(4, ...meses.map(m=>m.n));
  const W=560,H=200,pl=28,pb=28,bw=(W-pl)/6;
  const ticks = [0, Math.ceil(max/2), max];
  const chart = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Pedidos por mês">
    ${ticks.map(t=>{const y=H-pb-(t/max)*(H-pb-14); return `<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-body)">${t}</text>`;}).join('')}
    ${meses.map((m,i)=>{const h=(m.n/max)*(H-pb-14); const x=pl+i*bw+bw*.22; const last=i===5; return `<rect x="${x}" y="${H-pb-h}" width="${bw*.56}" height="${Math.max(h,0)}" rx="4" fill="${last?'var(--brand)':'var(--brand-2)'}" opacity="${last?1:.55}"/><text x="${x+bw*.28}" y="${H-pb-h-6}" text-anchor="middle" font-size="12" font-weight="800" fill="var(--fg)" font-family="var(--f-body)">${m.n}</text><text x="${x+bw*.28}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--f-body)">${m.rot}</text>`;}).join('')}
  </svg>`;
  const pendDocs = DB.documentos.filter(d=>d.status==='pendente').length;
  const denAb = DB.denuncias.filter(d=>d.status==='aberta').length;
  const novos = DB.pedidos.filter(p=>p.status==='recebido').length;
  const metas = [
    ['Cadastrar pelo menos 5 produtores rurais', prodAtivos.length>=META_PRODUTORES, `${prodAtivos.length}/5`],
    ['Parceria com pelo menos 5 estabelecimentos', estab.length>=META_ESTAB, `${estab.length}/5`],
    ['Criar o catálogo inicial de produtos', pub>=5, `${pub} produtos`],
    ['Realizar os primeiros pedidos pela plataforma', DB.pedidos.length>0, `${DB.pedidos.length} pedidos`],
    ['Acompanhar entregas e avaliar a satisfação', DB.avaliacoes.length>0, `${DB.avaliacoes.length} avaliações`]
  ];
  return { title:'Painel da equipe', html:`<div class="stack-lg">
    <div class="row between"><div><div class="eyebrow">Painel administrativo</div><h1 style="margin-top:4px">Visão geral</h1></div><span class="muted small">Atualizado ${fmtDT(now())}</span></div>
    ${(pendDocs||denAb||novos)?`<div class="row">${pendDocs?`<button class="btn sm sun" data-a="go" data-v="adm-verificar">${I('shield','sm')} ${pendDocs} documento(s) para conferir</button>`:''}${denAb?`<button class="btn sm danger" data-a="go" data-v="adm-anuncios">${I('flag','sm')} ${denAb} denúncia(s) aberta(s)</button>`:''}${novos?`<button class="btn sm ghost" data-a="go" data-v="adm-pedidos">${I('list','sm')} ${novos} pedido(s) aguardando produtor</button>`:''}</div>`:''}
    <div class="kpis">
      <div class="kpi"><span class="muted small">Produtores ativos</span><b>${prodAtivos.length}<span class="muted" style="font-size:.9rem"> / meta ${META_PRODUTORES}</span></b><div class="bar"><i style="width:${Math.min(100,prodAtivos.length/META_PRODUTORES*100)}%"></i></div></div>
      <div class="kpi"><span class="muted small">Estabelecimentos parceiros</span><b>${estab.length}<span class="muted" style="font-size:.9rem"> / meta ${META_ESTAB}</span></b><div class="bar"><i style="width:${Math.min(100,estab.length/META_ESTAB*100)}%"></i></div></div>
      <div class="kpi"><span class="muted small">Compradores ativos (60 dias)</span><b>${compradoresAtivos}</b></div>
      <div class="kpi"><span class="muted small">Produtos publicados</span><b>${pub}</b></div>
      <div class="kpi"><span class="muted small">Entregas no prazo</span><b>${entregues.length?Math.round(noPrazo/entregues.length*100):0}%</b><span class="tiny muted">${noPrazo} de ${entregues.length} entregues</span></div>
      <div class="kpi"><span class="muted small">Tempo médio de entrega</span><b>${tempo.toFixed(1).replace('.',',')} dias</b><span class="tiny muted">do pedido até a entrega</span></div>
      <div class="kpi"><span class="muted small">Satisfação média</span><b><span class="stars">★</span> ${sat.toFixed(1).replace('.',',')}</b><span class="tiny muted">${DB.avaliacoes.length} avaliações</span></div>
      <div class="kpi"><span class="muted small">Comissão de vendas concluídas</span><b class="num">${brl(comissao)}</b><span class="tiny muted">5% (percentual em teste)</span></div>
    </div>
    <div class="two-col">
      <div class="card stack"><div class="row between"><h3>Pedidos por mês</h3><span class="muted small">últimos 6 meses</span></div>${chart}</div>
      <div class="card stack"><h3>Metas da fase de testes (piloto)</h3><div class="list">${metas.map(([t,ok,v])=>`<div class="li static"><span class="pill ${ok?'ok':'warn'}">${ok?I('check','sm'):'…'}</span><div class="grow small"><b>${t}</b></div><span class="muted small num">${v}</span></div>`).join('')}</div></div>
    </div>
  </div>`};
}};

function exportarDados(u){
  const {senhaHash, salt, ...dados} = u;
  return { usuario:dados, pedidos:DB.pedidos.filter(p=>p.compradorId===u.id||p.produtorId===u.id).map(p=>({codigo:p.codigo,status:p.status,total:p.total,criadoEm:new Date(p.criadoEm).toISOString()})),
    produtos:DB.produtos.filter(p=>p.produtorId===u.id).map(p=>({nome:p.nome,preco:p.preco,qtd:p.qtd})), avaliacoes:DB.avaliacoes.filter(a=>a.compradorId===u.id||a.produtorId===u.id).map(a=>({nota:a.nota,comentario:a.comentario})),
    consentimentos:DB.consentimentos.filter(c=>c.usuarioId===u.id).map(c=>({versao:c.versao,dataHora:new Date(c.dataHora).toISOString(),revogadoEm:c.revogadoEm?new Date(c.revogadoEm).toISOString():null})) };
}

const A = {
  go:d=>{ if (d.v==='suporte'){ return go('chat',{id:'suporte:'+me().id}); } go(d.v, d.id?{id:d.id}:{}); },
  back:()=>back(),
  drawer:()=>{ S.drawer=!S.drawer; render(); },
  closesheet:()=>closeSheet(),
  sheetbg:(d,el,e)=>{ if (e.target===el) closeSheet(); },
  ob:d=>{ S.ob=+d.s; render(); },
  perm:async d=>{
    if (d.p==='localizacao'){
      if (!navigator.geolocation){ DB.config.permissoes.localizacao='indisponível'; save(); return render(); }
      navigator.geolocation.getCurrentPosition(pos=>{ S.gps={lat:pos.coords.latitude,lng:pos.coords.longitude}; DB.config.permissoes.localizacao='permitida'; save(); render(); },
        ()=>{ DB.config.permissoes.localizacao='não permitida'; save(); render(); toast('Localização não liberada. Você pode usar o app normalmente.'); }, {timeout:8000});
    } else {
      try{ const r = await Notification.requestPermission(); DB.config.permissoes.notificacoes = r==='granted'?'permitidas':'não permitidas'; }
      catch(e){ DB.config.permissoes.notificacoes='só dentro do app'; }
      save(); render();
    }
  },
  obfim:d=>{ DB.config.onboarded=true; DB.config.perfilInicial=d.p||null; save(); S.cad={papel:d.p||null}; go(d.p?'cadastro':'login',{},false); },
  olho:d=>{ const el = document.getElementById(d.id); S.verSenha[d.id]=!S.verSenha[d.id]; if (el){ el.type = S.verSenha[d.id]?'text':'password'; const b = el.nextElementSibling; b.innerHTML = I(S.verSenha[d.id]?'eyeoff':'eye'); b.setAttribute('aria-label', (S.verSenha[d.id]?'Esconder':'Mostrar')+' senha'); } },
  social:d=>toast('Entrar com '+d.s+' será ligado na versão final. Use e-mail e senha no protótipo.'),
  demo:d=>{ const e = document.getElementById('login-email'), s = document.getElementById('login-senha'); if (e&&s){ e.value=d.e; s.value=d.s; s.focus(); } },
  cadpapel:d=>{ const f = document.querySelector('form[data-f="cadastro"]'); if (f) Object.assign(S.cad, Object.fromEntries(new FormData(f))); delete S.cad.senha; S.cad.papel=d.p; render(); },
  termofull:()=>{ S.termoFull=!S.termoFull; const t=document.querySelector('.termo'); if(t) t.classList.toggle('full',S.termoFull); const b=document.querySelector('[data-a="termofull"]'); if(b) b.textContent=S.termoFull?'Recolher termo':'Ler termo completo'; },
  sigmodo:d=>{ S.sig.modo=d.m; render(); },
  siglimpar:()=>{ S.sig.desenhou=false; S.sig.data=null; S.sig.nome=''; render(); },
  assinar:()=>assinarTermo(),
  recusar:()=>{
    const novo = S.termoModo==='novo';
    sheet('Sem aceite, não dá para continuar', `<p>Precisamos dos seus dados (nome, contato, endereço e pedidos) para ${novo?'criar sua conta, ':''}mostrar seus produtos ou pedidos e combinar a entrega. Sem o seu consentimento, a LGPD não nos permite fazer isso.</p><p class="muted small">${novo?'Seus dados digitados não foram salvos.':'Você vai sair da conta. Pode voltar e assinar quando quiser.'}</p>`,
      `<button class="btn ghost" data-a="closesheet">Voltar ao termo</button><button class="btn danger" data-a="recusarok">${novo?'Cancelar cadastro':'Sair da conta'}</button>`);
  },
  recusarok:()=>{ closeSheet(); const novo = S.termoModo==='novo'; S.pend=null; S.sig={modo:null,desenhou:false,data:null}; DB.sessao=null; save(); S.view='login'; S.err= novo?'Cadastro não concluído: o aceite do Termo de Consentimento (LGPD) é obrigatório.':'Você saiu da conta porque o termo não foi assinado.'; render(); },
  sair:()=>{ DB.sessao=null; save(); S.stack=[]; S.drawer=false; S.view='login'; S.err=''; S.checkout=null; render(); toast('Você saiu da conta.'); },
  cat:d=>{ S.cat=d.c; if (d.stay){ document.querySelectorAll('.chips .chip').forEach(c=>c.classList.toggle('on', c.dataset.c===d.c)); document.getElementById('cat-lista').innerHTML=listaCatalogo(); } else go('catalogo'); },
  qtdp:d=>{ const el=document.getElementById('qtd-prod'); let v = parseFloat(String(el.value).replace(',','.'))||0; v = Math.max(1, v + (+d.d)); el.value = fmtQ(v); S.qtdProd={id:S.params.id, q:v}; },
  addcarr:d=>{
    const p = produto(d.id); const el = document.getElementById('qtd-prod'); const q = parseFloat(String(el.value).replace(',','.'));
    if (!(q>0)) return toast('Informe uma quantidade válida.');
    const c = carrinho(); const it = c.find(i=>i.produtoId===p.id); const tot = (it?it.qtd:0)+q;
    if (tot>p.qtd) return toast('Só há '+fmtQ(p.qtd)+' '+p.unidade+' disponível.');
    if (it) it.qtd = tot; else c.push({produtoId:p.id, qtd:q});
    save(); S.qtdProd=null; render(); toast(p.nome+' no carrinho.');
  },
  qtdc:d=>{ const c = carrinho(); const it = c.find(i=>i.produtoId===d.id); const p = produto(d.id); if(!it||!p) return; it.qtd += +d.d; if (it.qtd>p.qtd){ it.qtd=p.qtd; toast('Quantidade máxima disponível.'); } if (it.qtd<=0) c.splice(c.indexOf(it),1); save(); render(); },
  entrega:d=>{ S.checkout[d.pid].entrega=d.t; render(); },
  pfilter:d=>{ S.pfilter=d.f; render(); },
  admped:d=>{ S.adminPedFiltro=d.f; render(); },
  status:d=>mudarStatus(d.id, d.s),
  cancelar:d=>sheet('Cancelar pedido?', '<p>O produtor ainda não confirmou, então o cancelamento é imediato e sem custo.</p>', `<button class="btn ghost" data-a="closesheet">Manter pedido</button><button class="btn danger" data-a="cancelarok" data-id="${d.id}">Cancelar pedido</button>`),
  cancelarok:d=>{ closeSheet(); const p = pedido(d.id); if (p.status!=='recebido') return toast('Este pedido já foi confirmado e não pode ser cancelado aqui. Use o chat.'); p.status='cancelado'; p.etapas.cancelado=now(); notificar(p.produtorId,'Pedido cancelado',`O pedido ${p.codigo} foi cancelado pelo comprador.`,{v:'pedido',id:p.id}); save(); render(); toast('Pedido cancelado.'); },
  recusarped:d=>sheet('Recusar pedido', `<label class="field"><span>Motivo (o comprador vai ver)</span><select class="input" id="mot-rec"><option>Produto acabou</option><option>Não consigo entregar nesse dia</option><option>Endereço fora da minha rota</option><option>Outro motivo</option></select></label>`, `<button class="btn ghost" data-a="closesheet">Voltar</button><button class="btn danger" data-a="recusarpedok" data-id="${d.id}">Recusar pedido</button>`),
  recusarpedok:d=>{ const m = document.getElementById('mot-rec').value; closeSheet(); const p = pedido(d.id); p.status='recusado'; p.motivoRecusa='Motivo informado pelo produtor: '+m+'.'; notificar(p.compradorId,'Pedido recusado',`${user(p.produtorId).propriedade} recusou o pedido ${p.codigo}: ${m}.`,{v:'pedido',id:p.id}); save(); render(); toast('Pedido recusado e comprador avisado.'); },
  avaliar:d=>{ S.nota=5; sheet('Avaliar o produtor', `<div class="row" id="estrelas" style="font-size:2rem;gap:4px">${[1,2,3,4,5].map(n=>`<button class="btn link" style="font-size:2rem;text-decoration:none;color:var(--sun)" data-a="nota" data-n="${n}" aria-label="${n} estrelas">★</button>`).join('')}</div><label class="field"><span>Comentário</span><textarea class="input" id="av-com" placeholder="Como foi a qualidade e a entrega?"></textarea></label>`, `<button class="btn primary" data-a="avaliarok" data-id="${d.id}">Enviar avaliação</button>`); },
  nota:d=>{ S.nota=+d.n; document.querySelectorAll('#estrelas button').forEach((b,i)=>b.style.color = i<S.nota?'var(--sun)':'var(--line)'); },
  avaliarok:d=>{ const p = pedido(d.id); const com = document.getElementById('av-com').value.trim(); closeSheet(); if (DB.avaliacoes.some(a=>a.pedidoId===p.id)) return;
    DB.avaliacoes.push({id:nid('a'), pedidoId:p.id, compradorId:p.compradorId, produtorId:p.produtorId, nota:S.nota, comentario:com, criadoEm:now()});
    notificar(p.produtorId,'Nova avaliação',`Você recebeu ${S.nota} estrela(s) no pedido ${p.codigo}.`,{v:'pedido',id:p.id}); save(); render(); toast('Obrigado pela avaliação!'); },
  compartilhar:async d=>{ const p = pedido(d.id); const txt = `Pedido ${p.codigo} na AgroLink Castelo\n${p.itens.map(i=>`• ${fmtQ(i.qtd)} ${i.unidade} de ${i.nome}`).join('\n')}\nTotal: ${brl(p.total)}\nSituação: ${ST[p.status].t}\n${p.entrega==='entrega'?'Entrega':'Retirada'}: ${fmtDia(p.dataPrevista)}`;
    try{ if (navigator.share){ await navigator.share({title:'Pedido '+p.codigo, text:txt}); return; } }catch(e){}
    try{ await navigator.clipboard.writeText(txt); toast('Resumo do pedido copiado. Cole no WhatsApp ou e-mail.'); }catch(e){ sheet('Compartilhar pedido', `<textarea class="input" id="share-txt" style="min-height:160px">${esc(txt)}</textarea><p class="small muted">Selecione o texto e copie.</p>`, ''); } },

function refazFormProduto(){
  const form = document.querySelector('form[data-f="produto"]'); if (!form) return render();
  const vals = Object.fromEntries(new FormData(form)); const chk = {a:form.elements.origemAnimal.checked, o:form.elements.seloOrganico.checked};
  render(); const g = document.querySelector('form[data-f="produto"]'); if (!g) return;
  ['nome','categoria','unidade','preco','qtd','safra','descricao'].forEach(k=>{ if (typeof vals[k]==='string') g.elements[k].value=vals[k]; });
  g.elements.origemAnimal.checked=chk.a; g.elements.seloOrganico.checked=chk.o;
}
function mudarStatus(id, s){
  const p = pedido(id); const u = me();
  if (s==='confirmado'){
    for (const it of p.itens){ const pr = produto(it.produtoId); if (!pr || pr.qtd < it.qtd) return toast(`Estoque insuficiente de ${it.nome}. Ajuste a quantidade ou recuse o pedido.`); }
    p.itens.forEach(it=>{ const pr = produto(it.produtoId); pr.qtd = Math.round((pr.qtd-it.qtd)*100)/100; pr.atualizadoEm=now(); });
  }
  if (s==='entregue' && !['rota','pronto'].includes(p.status) && u.papel!=='admin') return;
  p.status = s; p.etapas[s] = now();
  const pr = user(p.produtorId);
  const msg = { confirmado:`${pr.propriedade} confirmou seu pedido ${p.codigo}.`, separacao:`Seu pedido ${p.codigo} está sendo separado.`, rota:`Seu pedido ${p.codigo} saiu para entrega.`, pronto:`Seu pedido ${p.codigo} está pronto para retirada na propriedade.`, entregue:`Pedido ${p.codigo} entregue. Que tal avaliar o produtor?` }[s];
  if (u.id!==p.compradorId) notificar(p.compradorId, ST[s].t, msg, {v:'pedido', id:p.id});
  if (u.id!==p.produtorId) notificar(p.produtorId, ST[s].t, `Pedido ${p.codigo}: ${ST[s].t.toLowerCase()}.`, {v:'pedido', id:p.id});
  save(); render(); toast('Situação atualizada: '+ST[s].t+'.');
}

function keepRender(){ refazFormProduto(); }
function enviarMsg(thread, texto, imagem){
  const u = me(); DB.mensagens.push({id:nid('m'), thread, de:u.id, texto, imagem, criadoEm:now()});
  const [tipo, ref] = thread.split(':');
  if (tipo==='pedido'){ const p = pedido(ref); [p.compradorId,p.produtorId].filter(x=>x!==u.id).forEach(x=>notificar(x,'Nova mensagem',`${u.propriedade||u.estabelecimento||u.nome}: ${(texto||'enviou uma foto').slice(0,80)}`,{v:'chat',id:thread})); }
  else if (u.papel==='admin') notificar(ref,'Resposta da AgroLink',(texto||'enviou uma foto').slice(0,90),{v:'chat',id:thread});
  else notificarAdmins('Atendimento',`${u.nome}: ${(texto||'enviou uma foto').slice(0,80)}`,{v:'chat',id:thread});
  save(); render(); const i = document.getElementById('msg-txt'); if (i) i.focus();
}
function lerImagem(file, max=640){
  return new Promise((res,rej)=>{ const r = new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.78)); }; img.onerror=rej; img.src=r.result; }; r.onerror=rej; r.readAsDataURL(file); });
}
